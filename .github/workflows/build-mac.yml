name: Build macOS

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the .dmg to (e.g. v2.2.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Build unpacked app
        run: npx electron-builder --mac dir --publish never

      - name: Ad-hoc sign so right-click Open works without Terminal
        run: |
          APP=$(find dist-app -name "Catalog.app" -maxdepth 2 | head -1)
          if [ -n "$APP" ]; then
            codesign --force --deep --sign - "$APP"
            echo "Signed $APP"
          fi

      # What a Catalog already installed downloads to update itself (electron/macUpdate.cjs):
      # the signed app, zipped with ditto so nothing a Mac app needs is lost.
      - name: Zip the app for in-app updates
        run: |
          APP=$(find dist-app -name "Catalog.app" -maxdepth 2 | head -1)
          VERSION=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist-app/Catalog-$VERSION-mac.zip"

      - name: Package into DMG
        run: |
          DIR=$(find dist-app -name "Catalog.app" -maxdepth 2 -exec dirname {} \; | head -1)
          npx electron-builder --mac dmg --prepackaged "$DIR" --publish never

      - name: Upload .dmg and update manifest to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          DMG=$(ls dist-app/*.dmg | head -1)
          gh release upload "$TAG" "$DMG" --clobber
          ZIP=$(ls dist-app/*-mac.zip | head -1)
          gh release upload "$TAG" "$ZIP" --clobber
          if [ -f dist-app/latest-mac.yml ]; then
            gh release upload "$TAG" dist-app/latest-mac.yml --clobber
          fi
